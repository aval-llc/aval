name: PostgreSQL migration foundation
on:
  pull_request:
    paths:
      - 'db/**'
      - 'lib/**'
      - 'app/**'
      - 'worker/**'
      - 'tests/**'
      - 'drizzle/**'
      - 'supabase/**'
      - 'infra/benchmark/**'
      - 'scripts/migration/**'
      - 'tests/migration/**'
      - 'tests/postgres/**'
      - 'package*.json'
      - 'desktop/package*.json'
      - 'desktop/test/**'
      - '.github/workflows/postgres-foundation.yml'
      - 'eslint.config.mjs'
      - '.node-version'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: aval-ci-disposable-only
          POSTGRES_DB: aval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aval_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      # The root unit suite includes desktop tests that validate the
      # electron-builder schema from desktop's own dependencies.
      - run: npm ci --prefix desktop
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run lint:migration
      - run: npm run test:migration
      - run: npm run db:inventory
      - run: git diff --exit-code -- docs/migration/inventory.json docs/migration/production-preflight.sql
      - run: npm run test:postgres
        env:
          AVAL_POSTGRES_CLIENT_IMAGE: postgres:17
          AVAL_TEST_DATABASE_URL: postgresql://postgres:aval-ci-disposable-only@127.0.0.1:5432/aval_test
      # This job verifies real PostgreSQL behavior. It does not satisfy the hosted Hyperdrive gate.
