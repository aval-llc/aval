name: Desktop release

# Every push to main publishes a fresh macOS DMG to the rolling
# "desktop-latest" prerelease, so the download link never changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Rapid pushes should not race each other for the rolling tag.
concurrency:
  group: desktop-release
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  verify-web:
    name: Verify web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      # `npm test` at the root discovers desktop/test/ too, and those cases read
      # the electron-builder schema out of desktop's own dependencies. The one
      # check that needs Apple silicon skips itself here; the rest need this.
      - run: npm ci --prefix desktop
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  release-desktop:
    name: Sign, notarize, verify, and publish DMG
    needs: verify-web
    # The bundled Codex runtime is darwin-arm64, so this must stay on Apple silicon.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

      - name: Require production signing credentials
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -n "${!name:-}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS artifacts
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac --publish never

      - name: Notarize and staple the DMG container
        working-directory: desktop
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          test "${#dmgs[@]}" -eq 1 || { echo "::error::Expected exactly one DMG"; exit 1; }
          xcrun notarytool submit "${dmgs[0]}" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "${dmgs[0]}"

      - name: Verify Developer ID, notarization, and Gatekeeper
        working-directory: desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          app="dist/mac-arm64/Aval.app"
          test -d "$app" || { echo "::error::Missing packaged app at $app"; exit 1; }
          dmg=(dist/*.dmg)
          test "${#dmg[@]}" -eq 1 || { echo "::error::Expected exactly one DMG"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee dist/CODESIGN.txt
          grep -q "Authority=Developer ID Application:" dist/CODESIGN.txt
          xcrun stapler validate "$app"
          xcrun stapler validate "${dmg[0]}"
          spctl --assess --type execute --verbose=4 "$app"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg[0]}"

          cd dist
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS

      - name: Require the matching website deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Aval Desktop loads the hosted dashboard. Publishing a new wrapper
          # before that exact commit is live would still show the old UI.
          for attempt in {1..80}; do
            state="$(gh run list --workflow cloudflare-production.yml --commit "$GITHUB_SHA" --branch main --limit 1 --json status,conclusion --jq '.[0] | if .status == "completed" then .conclusion else .status end')"
            case "$state" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required|skipped|stale)
                echo "::error::Website deployment did not succeed for $GITHUB_SHA ($state)"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the matching website deployment"
          exit 1

      - name: Publish rolling desktop-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd desktop/dist
          ls -lh ./*.dmg ./*.zip

          notes="$RUNNER_TEMP/aval-release-notes.md"
          cat > "$notes" <<EOF
          Hosted desktop build from commit \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`.

          Target: https://app.aval.llc. The matching Cloudflare
          deployment and authenticated production readiness check passed.

          Includes the movable native chat title bar, theme-aware frosted glass,
          and the live 0–100% transparency slider in Settings → Preferences.
          Text and controls remain opaque. Includes a bundled Codex runtime.
          Fixes interactive ChatGPT answers timing out after Codex completed
          the answer, by matching the turn lifecycle event's nested ID.

          The current hosted DMG is signed with Developer ID, notarized by Apple,
          stapled, Gatekeeper-assessed, and accompanied by SHA256SUMS.
          CODESIGN.txt records the signing identity for this build.

          Assets with \`-local-\` in their names are earlier local-server builds:
          they target http://127.0.0.1:3010, require that server, and are ad-hoc
          signed, not notarized. Their versioned checksum files remain available.
          Other versioned assets are retained as historical downloads.
          EOF

          # Move the rolling tag without deleting earlier versioned downloads.
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest ./*.dmg ./*.zip SHA256SUMS CODESIGN.txt --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/desktop-latest" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit desktop-latest --title "Aval Desktop (latest)" --notes-file "$notes" --prerelease
          else
            gh release create desktop-latest --target "$GITHUB_SHA" \
              --title "Aval Desktop (latest)" --notes-file "$notes" --prerelease \
              ./*.dmg ./*.zip SHA256SUMS CODESIGN.txt
          fi
